name: CI

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and generate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan for committed credentials
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Portfolio.slnx --locked-mode

      - name: Build
        run: dotnet build Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Portfolio.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Generate site
        run: dotnet run --project src/Portfolio.Generator --configuration Release --no-build -- --output dist

      - name: Verify generated output
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/about/index.html dist/now/index.html \
                   dist/404.html dist/sitemap.xml dist/robots.txt \
                   dist/staticwebapp.config.json; do
            test -s "$f" || { echo "::error::Missing or empty: $f"; exit 1; }
          done
          test -n "$(find dist/assets -name 'site.*.css' -print -quit)" \
            || { echo "::error::No hashed stylesheet in dist/assets"; exit 1; }
          echo "Generated $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1) total."

      - name: Check performance budget
        shell: pwsh
        run: ./scripts/check-performance.ps1

      - name: Set up browser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test tools
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check responsive layouts and fallbacks
        run: python tests/browser/check_site.py

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7
