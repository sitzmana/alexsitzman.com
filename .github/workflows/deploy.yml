name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validation gates deployment: the site is only published if this job succeeds.
  build:
    name: Build and validate
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.swa.outputs.static_web_app_url }}
    permissions:
      contents: read
      # Required for the deploy action to comment the preview URL on the pull request.
      pull-requests: write

    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_WATER_0E62D601E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The artifact is already built; Oryx must not try to build it again.
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true

  close-preview:
    name: Tear down pull request preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_WATER_0E62D601E }}
          action: close
